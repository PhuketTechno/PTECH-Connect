<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTECH Connect | วิทยาลัยเทคโนโลยีภูเก็ต</title>

    <!-- Favicon -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/957/957310.png">

    <!-- Fonts & Icons (Preconnect for faster loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/js/all.min.js" defer></script>

    <style>
        /* CSS ตัวใหม่ สไตล์ Modern & Glassmorphism */
        :root {
            /* Teal-Dark Dynamic Gradient */
            --bg-color-1: #071A1E;
            --bg-color-2: #164245;
            --bg-color-3: #0F6366;
            --bg-color-4: #0A2F32;

            --card-bg: rgba(15, 40, 42, 0.6);
            --card-hover: rgba(25, 65, 68, 0.85);
            --text-main: #FFFFFF;
            --text-muted: #A4BFC2;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Anuphan', sans-serif;
            background-color: var(--bg-color-1);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* --- NEW: Animated Background Elements --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-4));
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 12s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: #00FFCC;
            /* Bright Neon Cyan */
            top: -10%;
            left: -10%;
            animation-duration: 15s;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: #0F6366;
            /* Deep Teal */
            bottom: -20%;
            right: -10%;
            animation-duration: 18s;
            animation-direction: alternate-reverse;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: #164245;
            /* Medium Teal */
            top: 40%;
            left: 60%;
            animation-duration: 20s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(40px, 30px) scale(1.05);
            }
        }

        /* ----------------------------------------- */

        /* Container สำหรับจัดหน้าให้อยู่ตรงกลางและดูเหมือน App */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(10, 20, 22, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 1rem 2rem 2.5rem 2rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 204, 0.15);
            text-align: center;
            z-index: 1;
            /* Keep above background */
        }

        /* Header Profile */
        .profile {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem 1rem;
            margin-bottom: 2rem;
            background: rgba(10, 20, 22, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.15);
            margin-bottom: 1rem;
        }

        .profile h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 0.25rem;
        }

        .profile p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0;
            max-height: 40px;
            opacity: 1;
            overflow: hidden;
        }

        /* Scrolled (Compact) State */
        .profile.compact {
            padding: 0.5rem 1rem;
            border-radius: 0 0 24px 24px;
            margin-bottom: 1rem;
        }

        .profile.compact .profile-img {
            width: 45px;
            height: 45px;
            border-width: 2px;
            margin-bottom: 0.25rem;
        }

        .profile.compact h1 {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .profile.compact p {
            max-height: 0;
            opacity: 0;
            margin: 0;
        }

        /* Links Grid */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 204, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .link-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.2);
            border-color: rgba(0, 255, 204, 0.4);
        }

        .link-icon {
            font-size: 1.5rem;
            width: 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .link-text {
            flex: 1;
            text-align: left;
        }

        /* Brand Colors for Icons */
        .admission .link-icon {
            color: #f39c12;
        }

        .line .link-icon {
            color: #00B900;
        }

        .globe .link-icon {
            color: #2980b9;
        }

        .facebook .link-icon {
            color: #1877F2;
        }

        .discord .link-icon {
            color: #5865F2;
        }

        .messenger .link-icon {
            color: #00B2FF;
        }

        .map .link-icon {
            color: #EA4335;
        }

        .instagram .link-icon i {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Footer */
        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #799C9E;
        }

        .footer p {
            margin-bottom: 0.5rem;
        }

        .footer strong {
            color: #C0DEE0;
        }
    </style>
</head>

<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <header class="profile" id="profile">
            <img class="profile-img" src="https://lh3.googleusercontent.com/d/1hQmJz3B281BiRsrDluYP7HVpabqNPhqF=w200"
                alt="PTECH Logo">
            <h1>วิทยาลัยเทคโนโลยีภูเก็ต</h1>
            <p>PTECH Connect - ช่องทางการติดต่อ</p>
        </header>

        <!-- Links Section -->
        <main class="links-container" id="links-container">
            <div style="text-align: center; color: var(--text-muted); padding: 1rem;">กำลังโหลดข้อมูล...</div>
        </main>

        <!-- Footer Section -->
        <footer class="footer">
            <p><strong>วิทยาลัยเทคโนโลยีภูเก็ต</strong> <br> 224/9 ถ.เทพกระษัตรี ต.ตลาดใหญ่ อ.เมือง จ.ภูเก็ต 83000</p>
            <p>Email: PhuketTechno@gmail.com</p>
            <p>โทรศัพท์: 076-215419, 076-214147</p>
        </footer>
    </div>

    <!-- Default Statcounter code for PTECH Connec -->
    <script type="text/javascript">
        var sc_project = 12883466;
        var sc_invisible = 1;
        var sc_security = "d76bedab"; 
    </script>
    <script type="text/javascript" src="https://www.statcounter.com/counter/counter.js" async></script>
    <noscript>
        <div class="statcounter"><a title="free hit
counter" href="https://statcounter.com/" target="_blank"><img class="statcounter"
                    src="https://c.statcounter.com/12883466/0/d76bedab/1/" alt="free hit counter"
                    referrerPolicy="no-referrer-when-downgrade"></a></div>
    </noscript>
    <!-- End of Statcounter Code -->

    <!-- Script to fetch links & Header Scroll -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const profile = document.getElementById('profile');

            // Immediate scroll listener for a more responsive trigger
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    profile.classList.add('compact');
                } else {
                    profile.classList.remove('compact');
                }
            }, { passive: true }); // Passive true improves scroll performance

            // Fetch links logic
            try {
                const response = await fetch('./links.json' + '?v=' + new Date().getTime());
                const links = await response.json();

                const container = document.getElementById('links-container');
                container.innerHTML = '';

                links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = `link-card ${link.class}`;
                    a.innerHTML = `
                        <div class="link-icon"><i class="${link.icon}"></i></div>
                        <span class="link-text">${link.title}</span>
                    `;
                    container.appendChild(a);
                });
            } catch (error) {
                console.error('Error loading links:', error);
                const container = document.getElementById('links-container');
                container.innerHTML = '<div style="text-align: center; color: #fff;">ไม่สามารถโหลดข้อมูลลิงก์ได้</div>';
            }
        });
    </script>

</body>

</html>
