  <!-- Dynamic Link Loader & Skeleton Management -->
  <script>
    const linksContainer = document.getElementById("linksContainer");

    // Display unified whole-section skeleton loader while loading
    function showSkeleton() {
      linksContainer.innerHTML = `
        <div class="skeleton-section" aria-hidden="true">
          <div class="skeleton-section-inner">
            <div class="skeleton-sec-badge"></div>
            <div class="skeleton-sec-icon">
              <i class="bi bi-link-45deg"></i>
            </div>
            <div class="skeleton-sec-bar w-75"></div>
            <div class="skeleton-sec-bar w-50"></div>
          </div>
        </div>
      `;
    }

    // Render loaded links onto the page
    function renderLinks(linksArray) {
      linksContainer.innerHTML = "";
      if (!linksArray || linksArray.length === 0) {
        linksContainer.innerHTML = `
          <div class="text-center text-white fw-bold py-3" style="font-size: 0.95rem;">
            ยังไม่มีข้อมูลลิงก์
          </div>
        `;
        return;
      }

      linksArray.forEach((item, index) => {
        const a = document.createElement("a");
        a.href = item.url || "#";
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        // Assign cycling color class (color-1 through color-6)
        const colorIndex = (index % 6) + 1;
        a.className = `neo-btn color-${colorIndex}`;

        // Custom color overrides if specified in JSON
        if (item.bgColor) a.style.setProperty("--btn-bg", item.bgColor);
        if (item.textColor) a.style.setProperty("--btn-text", item.textColor);

        // Emoji or Icon class support
        const emojiHtml = item.emoji
          ? `<span class="btn-emoji">${item.emoji}</span>`
          : item.icon
            ? `<i class="${item.icon}"></i>`
            : "";

        // Optional status badge
        const badgeHtml = item.badge
          ? `<span class="badge-new">${item.badge}</span>`
          : "";

        a.innerHTML = `
          <span>${item.title}</span>
          ${emojiHtml}
          ${badgeHtml}
        `;
        linksContainer.appendChild(a);
      });
    }

    function renderConfig(cfg) {
      if (!cfg) return;
      if (cfg.address) {
        const addrEl = document.getElementById("footerAddressText");
        if (addrEl) addrEl.innerText = cfg.address;
      }
      if (cfg.phone1) {
        const p1El = document.getElementById("footerPhone1");
        const p1Text = document.getElementById("footerPhone1Text");
        if (p1El) p1El.href = "tel:" + cfg.phone1.replace(/[^0-9]/g, "");
        if (p1Text) p1Text.innerText = cfg.phone1;

        const socialPhone = document.getElementById("socialPhoneBtn");
        if (socialPhone) socialPhone.href = "tel:" + cfg.phone1.replace(/[^0-9]/g, "");
      }
      if (cfg.phone2) {
        const p2El = document.getElementById("footerPhone2");
        const p2Text = document.getElementById("footerPhone2Text");
        if (p2El) p2El.href = "tel:" + cfg.phone2.replace(/[^0-9]/g, "");
        if (p2Text) p2Text.innerText = cfg.phone2;
      }
      if (cfg.email) {
        const emailLink = document.getElementById("footerEmailLink");
        const emailText = document.getElementById("footerEmailText");
        if (emailLink) emailLink.href = "mailto:" + cfg.email;
        if (emailText) emailText.innerText = cfg.email;
      }
    }

    // Fetch links & config directly from links.json with skeleton loader transition
    async function initApp() {
      showSkeleton();

      const startTime = Date.now();
      let linksData = [];
      let configData = null;

      try {
        const response = await fetch(`./links.json?t=${startTime}`, { cache: "no-store" });
        if (!response.ok) throw new Error("Fetch failed: HTTP " + response.status);
        const data = await response.json();
        if (Array.isArray(data)) {
          linksData = data;
        } else {
          linksData = data.links || [];
          configData = data.config || null;
        }
      } catch (err) {
        console.warn("Could not load links.json, checking localStorage:", err);
        const cached = localStorage.getItem("ptech_links");
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed)) {
              linksData = parsed;
            } else {
              linksData = parsed.links || [];
              configData = parsed.config || null;
            }
          } catch (e) {
            linksData = [];
          }
        }
      }

      if (configData) {
        renderConfig(configData);
      } else {
        const cachedCfg = localStorage.getItem("ptech_config");
        if (cachedCfg) {
          try { renderConfig(JSON.parse(cachedCfg)); } catch (e) { }
        }
      }

      // Smooth display ensuring skeleton remains visible for at least 250ms for great visual feedback
      const elapsedTime = Date.now() - startTime;
      const minDelay = 250;
      const remainingDelay = Math.max(0, minDelay - elapsedTime);

      setTimeout(() => {
        renderLinks(linksData || []);
      }, remainingDelay);
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
